<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NU FindIt – Clickable Prototype</title>
<style>
:root{--bg:#e8edf8;--surface:#fff;--soft:#f3f5fb;--ink:#12234d;--mute:#5d6a8a;--line:#e1e6f2;--navy:#12306b;--on-navy:#fff;--orange:#f2822b;--green:#3f9a7d;--peach:#fdf0de;--found-bg:#dff1ea;--found-fg:#1f6b53;--lost-bg:#fde4d9;--lost-fg:#b4441c;--match-bg:#ebe3fb;--match-fg:#5b3bb0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0c1224;--surface:#151d36;--soft:#1d2746;--ink:#eaf0ff;--mute:#9aa7c8;--line:#2a3558;--navy:#5b86ec;--on-navy:#0c1224;--peach:#3a2c1c;--found-bg:#1d3b33;--found-fg:#7fd4b6;--lost-bg:#43271c;--lost-fg:#f3a283;--match-bg:#2d2552;--match-fg:#bda8f5}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0c1224;--surface:#151d36;--soft:#1d2746;--ink:#eaf0ff;--mute:#9aa7c8;--line:#2a3558;--navy:#5b86ec;--on-navy:#0c1224;--peach:#3a2c1c;--found-bg:#1d3b33;--found-fg:#7fd4b6;--lost-bg:#43271c;--lost-fg:#f3a283;--match-bg:#2d2552;--match-fg:#bda8f5}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Poppins","Inter",system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center}
.phone{width:390px;height:min(800px,100%);background:var(--surface);border-radius:38px;border:8px solid #1b1f2e;overflow:hidden;display:flex;flex-direction:column;position:relative;box-shadow:0 20px 50px rgba(18,35,77,.25)}
@media (max-width:500px){.phone{width:100%;height:100%;border:0;border-radius:0;box-shadow:none}}
#screen{flex:1;overflow-y:auto;padding:16px 16px 24px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
svg{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.15em;flex:none}
.thumb,.hero{color:var(--navy);overflow:hidden}
.thumb img,.hero img{width:100%;height:100%;object-fit:cover}
.drop{display:grid;place-items:center;text-align:center;gap:4px;min-height:120px;margin:0;border:2px dashed var(--line);border-radius:16px;background:var(--soft);color:var(--mute);cursor:pointer;overflow:hidden;padding:12px}
.drop svg{font-size:30px;color:var(--navy)}.drop small{font-size:12px}.drop img{width:100%;max-height:200px;object-fit:cover;border-radius:10px}
.scan{position:absolute;inset:0;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;z-index:5}
.scan span{font-size:13px;color:var(--mute)}
.spin{width:44px;height:44px;border:4px solid var(--line);border-top-color:var(--navy);border-radius:50%}
@media (prefers-reduced-motion:no-preference){.spin{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);border-radius:24px 24px 0 0;padding:20px 16px 24px;z-index:6;box-shadow:0 -10px 30px rgba(0,0,0,.25)}
.sheet h3{margin:0 0 10px}.sheet p{font-size:13.5px;line-height:1.5;margin:8px 0;display:flex;gap:8px}.sheet p svg{color:var(--green);margin-top:3px}.sheet .cta{margin-top:10px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.logo{font-weight:700;font-size:24px;color:var(--navy);display:flex;align-items:center;gap:8px}
.bell{position:relative;font-size:22px;padding:6px}
.bell b{position:absolute;top:0;right:0;background:#d92d2d;color:#fff;font-size:11px;width:18px;height:18px;border-radius:50%;display:grid;place-items:center}
.search{display:flex;gap:8px;margin-bottom:12px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:12px 14px;width:100%}
textarea{resize:none;height:72px}
.big{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.big button{border-radius:16px;padding:16px 10px;color:#fff;font-weight:600;font-size:15px}
.lost-btn{background:#e8741c}.found-btn{background:#2f7d63}
.banner{background:var(--peach);border-radius:18px;padding:14px;margin-bottom:12px}
.banner h3{margin:0 0 6px;font-size:16px}
.banner p{margin:0 0 10px;font-size:13px;color:var(--mute);line-height:1.5}
.cta{background:var(--navy);color:var(--on-navy);border-radius:14px;padding:12px 18px;font-weight:600;width:100%}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px}
.chip{flex:none;background:var(--soft);border-radius:999px;padding:8px 14px;font-size:13px;white-space:nowrap}
.chip.on{background:var(--navy);color:var(--on-navy)}
.card{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px;margin-bottom:10px}
.thumb{flex:none;width:64px;height:64px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:30px}
.card .t{flex:1;min-width:0}.card .t b{display:block;font-size:15px}.card .t span{display:block;font-size:12.5px;color:var(--mute);margin-top:2px}
.tag{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px}
.Found{background:var(--found-bg);color:var(--found-fg)}.Lost{background:var(--lost-bg);color:var(--lost-fg)}.Matched,.Verified{background:var(--match-bg);color:var(--match-fg)}
.tabs{display:flex;justify-content:space-around;align-items:flex-end;border-top:1px solid var(--line);padding:6px 4px 10px;background:var(--surface)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--mute);padding:4px 8px}
.tab i{font-style:normal;font-size:20px}.tab.on{color:var(--navy);font-weight:600}
.plus{width:54px;height:54px;border-radius:50%;background:var(--navy);color:var(--on-navy);font-size:28px;margin-top:-22px;box-shadow:0 6px 14px rgba(18,48,107,.35)}
h2{font-size:20px;margin:4px 0 12px}
.back{color:var(--mute);font-size:14px;margin-bottom:8px;padding:4px 0}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:14px;padding:4px;margin-bottom:12px}
.seg button{padding:10px;border-radius:11px;font-weight:600}.seg .on{background:var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.12)}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
.hero{height:140px;border-radius:18px;background:var(--soft);display:grid;place-items:center;font-size:64px;margin-bottom:12px}
.why{background:var(--match-bg);color:var(--match-fg);border-radius:14px;padding:10px 12px;font-size:13px;margin:10px 0;line-height:1.5}
.note{font-size:12.5px;color:var(--mute);margin:10px 0}
.steps{display:flex;justify-content:space-between;margin:12px 0;font-size:11.5px;color:var(--mute)}
.steps span{flex:1;text-align:center;padding-top:8px;border-top:4px solid var(--line)}.steps .d{border-color:var(--green);color:var(--ink)}
.msgs{display:flex;flex-direction:column;gap:8px;margin:8px 0 12px}
.m{max-width:80%;padding:9px 13px;border-radius:16px;font-size:14px;line-height:1.4}
.m.me{align-self:flex-end;background:var(--navy);color:var(--on-navy)}.m.them{align-self:flex-start;background:var(--soft)}
.toast{position:absolute;left:16px;right:16px;bottom:84px;background:var(--ink);color:var(--surface);padding:12px 16px;border-radius:14px;font-size:14px;text-align:center}
.stat{display:flex;gap:10px;margin:12px 0}.stat div{flex:1;background:var(--soft);border-radius:14px;padding:12px;text-align:center}.stat b{display:block;font-size:22px;color:var(--navy)}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .25s ease-out}@keyframes up{from{transform:translateY(10px);opacity:0}}}
</style>
</head>
<body>
<div class="phone" id="phone">
  <div id="screen"></div>
  <nav class="tabs" id="tabs"></nav>
</div>
<script>
const P={bag:'<path d="M8 6a4 4 0 0 1 8 0"/><rect x="5" y="6" width="14" height="15" rx="3"/><path d="M9 13h6M9 17h6"/>',headphones:'<path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/>',key:'<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3M14 9l2 2"/>',idcard:'<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M6 16c.6-1.6 5.4-1.6 6 0M15 10h3M15 14h3"/>',bottle:'<path d="M10 2h4v3l1 2v13a2 2 0 0 1-2 2h-2a2 2 0 0 1-2-2V7l1-2z"/><path d="M9 11h6"/>',shirt:'<path d="M8 3l-5 3 2 4 3-1v12h8V9l3 1 2-4-5-3a4 4 0 0 1-8 0z"/>',box:'<path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8M12 13v8"/>',search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',logo:'<circle cx="10" cy="10" r="7"/><path d="M20 20l-5.5-5.5"/><circle cx="10" cy="9" r="2"/>',pin:'<path d="M12 22s7-6.5 7-12a7 7 0 0 0-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',bell:'<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21h4"/>',alert:'<circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/>',found:'<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>',home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10M10 20v-6h4v6"/>',chat:'<path d="M21 12a8 8 0 0 1-11.5 7.2L4 20l1-4.5A8 8 0 1 1 21 12z"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-5 15-5 16 0"/>',lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',sparkle:'<path d="M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/>',camera:'<path d="M4 8h3l2-3h6l2 3h3v12H4z"/><circle cx="12" cy="13" r="3.5"/>',check:'<path d="M5 12l5 5 9-10"/>',grad:'<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 3 9 3 12 0v-5"/>',plus:'<path d="M12 5v14M5 12h14"/>'};
const ic=n=>`<svg viewBox="0 0 24 24" aria-hidden="true">${P[n]}</svg>`;
const ICON={Bags:ic("bag"),Electronics:ic("headphones"),Keys:ic("key"),"IDs & Cards":ic("idcard"),Bottles:ic("bottle"),Clothing:ic("shirt"),Other:ic("box")};
const CATS=["Bags","Electronics","Keys","IDs & Cards","Bottles","Clothing","Other"];
const PLACES=["Library, 2nd floor","Engineering Building","Cafeteria","Gym","Parking lot","Lecture hall A","Main gate"];
let items=[
 {id:1,name:"Black Backpack",cat:"Bags",place:"Library, 2nd floor",time:"2 hours ago",type:"Found",desc:"Black backpack with a laptop sleeve, left on a study table.",q:"What is clipped to the zipper?",sens:false},
 {id:2,name:"AirPods Case",cat:"Electronics",place:"Engineering Building",time:"3 hours ago",type:"Lost",desc:"White case with a small scratch on the lid.",q:"What color is the sticker inside the lid?",sens:false},
 {id:3,name:"Student ID Card",cat:"IDs & Cards",place:"Cafeteria",time:"5 hours ago",type:"Matched",desc:"Details hidden to protect the owner.",q:"What is the last 3 digits of the ID?",sens:true},
 {id:4,name:"Water Bottle",cat:"Bottles",place:"Gym",time:"Yesterday",type:"Found",desc:"Blue steel bottle with a dent near the bottom.",q:"What sticker is on the bottle?",sens:false},
 {id:5,name:"Car Keys",cat:"Keys",place:"Parking lot",time:"Yesterday",type:"Lost",desc:"Key ring with a red tag.",q:"What brand is on the key?",sens:false}];
let chats=[];
const S={tab:"home",view:null,id:null,cat:"All",q:"",kind:"Lost",toast:""};
const $=s=>document.querySelector(s);
const get=id=>items.find(i=>i.id===id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function card(i){return `<button class="card" data-act="open" data-id="${i.id}"><div class="thumb">${pic(i)}</div><div class="t"><b>${esc(i.name)}</b><span>${ic("pin")} ${esc(i.place)}</span><span>${ic("clock")} ${i.time}</span></div><span class="tag ${i.type}">${i.type}</span></button>`}
function list(){const q=S.q.toLowerCase();const r=items.filter(i=>(S.cat==="All"||i.cat===S.cat)&&(i.name+i.place+i.desc).toLowerCase().includes(q));
 return r.length?r.map(card).join(""):`<p class="note">No items match. Try another category, or report what you lost.</p>`}
function chips(){return ["All",...CATS].map(c=>`<button class="chip ${S.cat===c?"on":""}" data-act="cat" data-v="${c}">${c==="All"?"All":ICON[c]+" "+c}</button>`).join("")}

function home(){return `<div class="top"><div class="logo">${ic("logo")} NU FindIt</div><button class="bell" aria-label="Notifications" data-act="open" data-id="1">${ic("bell")}<b>2</b></button></div>
<div class="search"><input id="q" placeholder="Search lost &amp; found items…" value="${esc(S.q)}" aria-label="Search"></div>
<div class="big"><button class="lost-btn" data-act="report" data-v="Lost">${ic("alert")} I lost something</button><button class="found-btn" data-act="report" data-v="Found">${ic("found")} I found something</button></div>
<div class="banner"><h3>${ic("sparkle")} Potential match found</h3><p>Your lost Black Backpack may match an item found at Library, 2nd floor.</p><button class="cta" data-act="open" data-id="1">Review and verify</button></div>
<div class="chips">${chips()}</div><div id="feed">${list()}</div>`}
function search(){return `<h2>Search</h2><input id="q" placeholder="Try “keys” or “library”" value="${esc(S.q)}" aria-label="Search"><div class="chips" style="margin-top:10px">${chips()}</div><div id="feed">${list()}</div>`}

function detail(){const i=get(S.id);const found=i.type!=="Lost";const st=["Reported","Potential match","Verified","Returned"];const lvl=i.verified?3:(i.type==="Matched"?2:1);
 return `<button class="back" data-act="back">← Back</button><div class="hero">${pic(i)}</div>
<div class="top"><h2 style="margin:0">${esc(i.name)}</h2><span class="tag ${i.verified?"Verified":i.type}">${i.verified?"Verified":i.type}</span></div>
<p class="note">${ic("pin")} ${esc(i.place)} · ${ic("clock")} ${i.time}</p><p style="font-size:14px;line-height:1.5;margin:0">${esc(i.desc)}</p>
${i.id===1?`<div class="why"><b>Why this matches:</b> same place (Library), same color (black), reported 2 hours apart.</div>`:""}
<div class="steps">${st.map((s,k)=>`<span class="${k<lvl?"d":""}">${s}</span>`).join("")}</div>
${i.verified?`<button class="cta" data-act="tab" data-v="chats">Open private chat</button>`:`<button class="cta" data-act="verify">${found?"This is mine":"I found this item"}</button>`}
<p class="note">${ic("lock")} Your phone number and email stay hidden until ownership is verified.</p>`}

function verify(){const i=get(S.id);return `<button class="back" data-act="back">← Back</button><h2>Verify ownership</h2>
<p class="note">Answer the question only the real owner would know. The finder checks it before sharing details.</p>
<label for="ans">${esc(i.q)}</label><input id="ans" placeholder="Your answer">
<p class="note" id="err" style="color:var(--lost-fg)"></p><button class="cta" data-act="submitVerify">Send answer</button>`}

function report(){const f=S.kind==="Found";return `<h2>Report an item</h2>
<div class="seg"><button class="${!f?"on":""}" data-act="kind" data-v="Lost">I lost it</button><button class="${f?"on":""}" data-act="kind" data-v="Found">I found it</button></div>
<label for="r-name">Item name</label><input id="r-name" placeholder="e.g. Grey hoodie">
<label for="r-cat">Category</label><select id="r-cat">${CATS.map(c=>`<option>${c}</option>`).join("")}</select>
<label for="r-place">Where on campus?</label><select id="r-place">${PLACES.map(c=>`<option>${c}</option>`).join("")}</select>
<label for="r-desc">Description</label><textarea id="r-desc" placeholder="Color, brand, marks…"></textarea>
${f?`<label for="r-q">Verification question (keep the answer to yourself)</label><input id="r-q" placeholder="e.g. What is inside the front pocket?">`:""}
<label for="r-file">Photo</label><label class="drop" id="drop" for="r-file">${S.photo?`<img src="${S.photo}" alt="Selected photo">`:`${ic("camera")}<b>Add a photo</b><small>Tap to upload or take a picture</small>`}</label><input type="file" id="r-file" accept="image/*" hidden>
<p class="note">${ic("sparkle")} AI checks your text and photo for personal info before posting.</p>
<p class="note" id="err" style="color:var(--lost-fg)"></p><button class="cta" data-act="post">Post report</button>`}

function chatList(){return `<h2>Chats</h2>${chats.length?chats.map(c=>`<button class="card" data-act="chat" data-id="${c.id}"><div class="thumb">${ic("chat")}</div><div class="t"><b>${esc(get(c.id).name)}</b><span>${esc(c.msgs[c.msgs.length-1].t)}</span></div><span class="tag Verified">Verified</span></button>`).join(""):`<p class="note">No chats yet. Chats open after an owner is verified. Open an item and tap “This is mine” to try it.</p>`}`}
function chat(){const c=chats.find(x=>x.id===S.id);return `<button class="back" data-act="back">← Chats</button><h2>${esc(get(S.id).name)}</h2><p class="note">${ic("lock")} Private chat. Contact info is not shared.</p>
<div class="msgs">${c.msgs.map(m=>`<div class="m ${m.me?"me":"them"}">${esc(m.t)}</div>`).join("")}</div>
<div class="search"><input id="msg" placeholder="Message" aria-label="Message"><button class="cta" style="width:auto" data-act="send">Send</button></div>
<button class="chip" data-act="returned" style="width:100%;padding:12px">Mark as returned</button>`}
function profile(){return `<h2>Profile</h2><div class="card" style="cursor:default"><div class="thumb">${ic("grad")}</div><div class="t"><b>Nile University student</b><span>Verified university email</span></div></div>
<div class="stat"><div><b>${items.filter(i=>i.mine).length}</b>Reports</div><div><b>${items.filter(i=>i.returned).length}</b>Returned</div></div>
<p class="note">Prototype only. Nothing here is saved or sent anywhere.</p>`}

function render(){
 const v=S.view;
 $("#screen").innerHTML=v==="detail"?detail():v==="verify"?verify():v==="chat"?chat():S.tab==="home"?home():S.tab==="search"?search():S.tab==="report"?report():S.tab==="chats"?chatList():profile();
 const T=[["home","home","Home"],["search","search","Search"],["report","plus","Report"],["chats","chat","Chats"],["profile","user","Profile"]];
 $("#tabs").innerHTML=T.map(([k,icn,l])=>k==="report"?`<button class="tab" data-act="tab" data-v="report" aria-label="Report an item"><span class="plus tab" style="padding:0;display:grid;place-items:center;color:var(--on-navy)">${ic("plus")}</span>${l}</button>`:`<button class="tab ${S.tab===k&&!v?"on":""}" data-act="tab" data-v="${k}"><i>${ic(icn)}</i>${l}</button>`).join("");
 if(S.toast){const t=document.createElement("div");t.className="toast";t.textContent=S.toast;$("#phone").appendChild(t);S.toast="";setTimeout(()=>t.remove(),2200)}
}
function go(p){Object.assign(S,p);render()}

document.addEventListener("click",e=>{
 const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act,v=b.dataset.v,id=+b.dataset.id;
 if(a==="tab")go({tab:v,view:null});
 else if(a==="open")go({view:"detail",id});
 else if(a==="back")go({view:S.view==="verify"?"detail":null});
 else if(a==="cat")go({cat:v});
 else if(a==="report"){go({tab:"report",view:null,kind:v})}
 else if(a==="kind")go({kind:v});
 else if(a==="verify")go({view:"verify"});
 else if(a==="photo"){b.innerHTML=ic("check")+" Photo added";}
 else if(a==="submitVerify"){
  if(!$("#ans").value.trim()){$("#err").textContent="Enter an answer so the finder can check it.";return}
  const i=get(S.id);i.verified=true;if(!chats.find(c=>c.id===i.id))chats.push({id:i.id,msgs:[{t:"Hi! Your answer matches. Where can we meet on campus?",me:false}]});
  go({view:"detail",toast:"Verified. Private chat opened."})}
 else if(a==="post"){
  const n=$("#r-name").value.trim();if(!n){$("#err").textContent="Add an item name before posting.";return}
  return startPost(n);
  }
 else if(a==="chat")go({view:"chat",id});
 else if(a==="closesheet"||a==="openchat"){document.querySelector(".sheet")?.remove();if(a==="openchat")go({tab:"chats",view:"chat",id})}
 else if(a==="send"){const m=$("#msg").value.trim();if(!m)return;const c=chats.find(x=>x.id===S.id);c.msgs.push({t:m,me:true});render();
  setTimeout(()=>{c.msgs.push({t:"Great, see you at the main gate at 2 pm.",me:false});if(S.view==="chat")render()},900)}
 else if(a==="returned"){const i=get(S.id);i.returned=true;i.type="Found";go({view:null,tab:"profile",toast:"Marked as returned. Thanks for using NU FindIt."})}
});
document.addEventListener("input",e=>{if(e.target.id==="q"){S.q=e.target.value;$("#feed").innerHTML=list()}});
document.addEventListener("change",e=>{if(e.target.id!=="r-file"||!e.target.files[0])return;const r=new FileReader();r.onload=()=>{S.photo=r.result;$("#drop").innerHTML=`<img src="${S.photo}" alt="Selected photo">`};r.readAsDataURL(e.target.files[0])});
function pic(i){return i.sens?ic("lock"):i.photo?`<img src="${i.photo}" alt="">`:ICON[i.cat]}

/* Simulated AI: a real build would use OCR + a vision model and a lookup against registered accounts. */
function startPost(n){
 const f=S.kind==="Found",cat=$("#r-cat").value,place=$("#r-place").value;
 let desc=$("#r-desc").value.trim()||"No description.";
 const q=f?(($("#r-q")||{}).value||"Describe the item."):"Describe the item.";
 const hits=[];
 [[/\+?\d[\d\s-]{8,}\d/g,"phone number"],[/[\w.-]+@[\w.-]+\.\w+/g,"email address"]].forEach(([r,l])=>{if(r.test(desc)){hits.push(l);desc=desc.replace(r,"[hidden]")}});
 const isID=f&&cat==="IDs & Cards";
 const ov=document.createElement("div");ov.className="scan";
 ov.innerHTML=`<div class="spin"></div><b>${isID?"Scanning the ID card…":"AI is checking your report…"}</b><span>Looking for personal info${S.photo?" in your text and photo":""}</span>`;
 $("#phone").appendChild(ov);
 setTimeout(()=>{ov.remove();finish()},1800);
 function finish(){
  const id=Date.now(),rows=[];
  items.unshift({id,name:isID?"ID card":n,cat,place,time:"Just now",type:isID?"Matched":S.kind,desc:isID?"Details hidden to protect the owner.":desc,q,mine:true,sens:isID,verified:isID,photo:isID?null:S.photo});
  if(isID)chats.push({id,msgs:[{t:"The owner confirmed this ID is theirs. Where can we meet on campus?",me:false}]});
  if(hits.length)rows.push("Removed "+hits.join(" and ")+" from your description.");
  if(S.photo&&!isID)rows.push("Photo checked for faces, ID numbers and card details. Anything personal is blurred in the feed.");
  if(isID)rows.push("ID card detected. The AI read the name and ID number and matched them to a registered account (student ending 1042).","The owner was alerted. You never see their name, email or phone number.","The photo and card details stay private.");
  if(!rows.length)rows.push("No personal info found. Your report is live.");
  S.photo=null;
  go({tab:"home",view:null,cat:"All",q:"",toast:""});
  const sh=document.createElement("div");sh.className="sheet";
  sh.innerHTML=`<h3>${isID?"Owner found":"Report posted"}</h3>${rows.map(r=>`<p>${ic("check")}<span>${r}</span></p>`).join("")}<button class="cta" data-act="${isID?"openchat":"closesheet"}" data-id="${id}">${isID?"Open private chat":"Done"}</button>`;
  $("#phone").appendChild(sh);
 }
}
render();
</script>
